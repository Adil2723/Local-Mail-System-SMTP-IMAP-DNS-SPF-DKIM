protocols = imap
listen = *
mail_location = maildir:/home/adil/Maildir
auth_mechanisms = plain
disable_plaintext_auth = no
ssl = no
passdb {
driver = passwd-file
args = scheme=SHA512-CRYPT username_format=%n /etc/dovecot/users
}
userdb {
driver = static
args = uid=adil gid=adil home=/home/adil
}
log_path = /dev/stderr
info_log_path = /dev/stderr
