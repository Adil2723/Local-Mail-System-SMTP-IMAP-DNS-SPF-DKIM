x-node: &node
  image: cn-mail-lab-tools:local
  init: true
  cap_add:
    - NET_ADMIN

services:
  r1:
    <<: *node
    sysctls:
      net.ipv4.ip_forward: "1"
    command:
      - sh
      - -ec
      - |
        ip route replace 10.10.2.0/24 via 10.10.0.12
        exec sleep infinity
    networks:
      alpha:
        ipv4_address: 10.10.1.254
      core:
        ipv4_address: 10.10.0.11

  r2:
    <<: *node
    sysctls:
      net.ipv4.ip_forward: "1"
    command:
      - sh
      - -ec
      - |
        ip route replace 10.10.1.0/24 via 10.10.0.11
        exec sleep infinity
    networks:
      core:
        ipv4_address: 10.10.0.12
      beta:
        ipv4_address: 10.10.2.254

  client-alpha:
    <<: *node
    dns:
      - 10.10.0.53
    command:
      - sh
      - -ec
      - |
        ip route replace 10.10.0.0/24 via 10.10.1.254
        ip route replace 10.10.2.0/24 via 10.10.1.254
        exec sleep infinity
    networks:
      alpha:
        ipv4_address: 10.10.1.20

  client-beta:
    <<: *node
    dns:
      - 10.10.0.53
    command:
      - sh
      - -ec
      - |
        ip route replace 10.10.0.0/24 via 10.10.2.254
        ip route replace 10.10.1.0/24 via 10.10.2.254
        exec sleep infinity
    networks:
      beta:
        ipv4_address: 10.10.2.20

  dns:
    <<: *node
    image: cn-mail-lab-dns:local
    command:
      - sh
      - -ec
      - |
        ip route replace 10.10.1.0/24 via 10.10.0.11
        ip route replace 10.10.2.0/24 via 10.10.0.12
        exec named -g -4 -u bind -c /etc/bind/named.conf
    networks:
      core:
        ipv4_address: 10.10.0.53

networks:
  alpha:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
          gateway: 10.10.1.1

  core:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

  beta:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24
          gateway: 10.10.2.1
