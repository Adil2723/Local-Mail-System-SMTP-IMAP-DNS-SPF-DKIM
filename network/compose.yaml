name: cn12-topology

services:

  r1:
    image: cn12-nettools:local
    hostname: r1
    environment:
      ROLE: r1
    command: ["sh", "/lab/start.sh"]
    volumes:
      - ./start.sh:/lab/start.sh:ro
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      alpha:
        ipv4_address: 10.10.1.254
      core:
        ipv4_address: 10.10.0.11

  r2:
    image: cn12-nettools:local
    hostname: r2
    environment:
      ROLE: r2
    command: ["sh", "/lab/start.sh"]
    volumes:
      - ./start.sh:/lab/start.sh:ro
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      core:
        ipv4_address: 10.10.0.12
      beta:
        ipv4_address: 10.10.2.254

  client-alpha:
    image: cn12-nettools:local
    hostname: client-alpha
    environment:
      ROLE: alpha
    command: ["sh", "/lab/start.sh"]
    volumes:
      - ./start.sh:/lab/start.sh:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      - r1
    networks:
      alpha:
        ipv4_address: 10.10.1.20

  client-beta:
    image: cn12-nettools:local
    hostname: client-beta
    environment:
      ROLE: beta
    command: ["sh", "/lab/start.sh"]
    volumes:
      - ./start.sh:/lab/start.sh:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      - r2
    networks:
      beta:
        ipv4_address: 10.10.2.20

networks:

  alpha:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
          gateway: 10.10.1.1

  core:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

  beta:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24
          gateway: 10.10.2.1
